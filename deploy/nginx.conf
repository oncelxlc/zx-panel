# Place inside an HTTPS server block with the exact configured server_name.
# Keep the listener private; the browser and API share this one public origin.
location / {
    # Compress static code/styles; JSON credentials, SSE and log downloads stay uncompressed.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/javascript text/javascript text/css;
    proxy_pass http://127.0.0.1:25000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 75s;
    proxy_send_timeout 20s;
    client_max_body_size 1m;
}
