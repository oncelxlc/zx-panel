# 监听容器内所有网络接口。
# 宿主机端口仍会在 compose.yaml 中限制为 127.0.0.1。
bind 0.0.0.0

port 6379
protected-mode yes

# Docker 容器中必须保持前台运行
daemonize no

# 日志
loglevel notice

# 默认逻辑数据库数量
databases 16

# 数据目录，对应 Docker 命名卷
dir /data

# -------------------------------
# 持久化
# -------------------------------

# RDB 快照
save 900 1
save 300 10
save 60 10000

dbfilename dump.rdb

# AOF 持久化
appendonly yes
appendfilename "appendonly.aof"

# everysec 是性能与数据安全之间的常见折中
appendfsync everysec

# AOF 重写期间仍正常执行 fsync
no-appendfsync-on-rewrite no

# -------------------------------
# 内存
# -------------------------------

# 本地开发限制为 512 MB，可按实际情况调整
maxmemory 512mb

# 作为缓存使用时推荐
maxmemory-policy allkeys-lru

# -------------------------------
# 网络
# -------------------------------

timeout 0
tcp-keepalive 300
