name: Verify v1.1
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  workflow:
    name: Workflow syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/go.sum
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
  frontend-compatibility:
    name: Frontend / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.2', '26.0.0']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Frontend checks
        run: pnpm typecheck && pnpm lint && pnpm test && pnpm test:login && pnpm test:theme && pnpm test:dev
      - run: pnpm build:release
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: panel_test
          POSTGRES_PASSWORD: ci-isolated-only
          POSTGRES_DB: panel_control
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U panel_test -d panel_control"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://panel_test:ci-isolated-only@127.0.0.1:5432/panel_control?sslmode=disable
      ZX_PANEL_INTEGRATION: "1"
      ZX_PANEL_CONTRACT_FIXTURES: "1"
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: backend/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL 18 clients
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo '/usr/lib/postgresql/18/bin' >> "$GITHUB_PATH"
      - name: Check PostgreSQL clients
        run: |
          pg_dump --version | grep -E '^pg_dump \(PostgreSQL\) 18\.'
          pg_restore --version | grep -E '^pg_restore \(PostgreSQL\) 18\.'
      - name: Frontend checks
        run: pnpm typecheck && pnpm lint && pnpm test && pnpm test:login && pnpm test:theme && pnpm test:dev
      - name: Go race and isolated database tests
        run: go -C backend test -count=1 -race -tags devassets ./...
      - name: Go vet
        run: go -C backend vet -tags devassets ./...
      - run: pnpm contract --check-go
      - run: git diff --exit-code -- docs/openapi.json docs/error-codes.json
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:api
      - run: pnpm audit && go -C backend run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -tags devassets ./...
      - run: pnpm scan:secrets
      - run: pnpm release
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-and-linux-builds
          path: |
            test-results/
            frontend/test-results/
            frontend/test-results-api/
            frontend/playwright-report/
            release/
          retention-days: 7
